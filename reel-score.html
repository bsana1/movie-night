<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reel Score</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reel Score">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1116">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230F1116'/%3E%3Ctext x='50' y='62' font-size='38' text-anchor='middle' fill='%23D4A94B' font-family='Georgia,serif' font-weight='bold'%3E7.0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&family=Work+Sans:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1116;
    --bg-alt: #171A22;
    --bg-card: #1C2029;
    --gold: #D4A94B;
    --gold-dim: #8A6F30;
    --velvet: #B23A48;
    --text: #EDE6D6;
    --text-dim: #8B8F9C;
    --line: #2A2E38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* --- Marquee header --- */
  .marquee{
    position: relative;
    text-align: center;
    padding: 28px 10px 22px;
    margin-bottom: 28px;
    border-top: 2px solid var(--line);
    border-bottom: 2px solid var(--line);
  }
  .marquee::before, .marquee::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:1px;
    background: repeating-linear-gradient(90deg, var(--gold-dim) 0 6px, transparent 6px 14px);
    opacity:.6;
  }
  .marquee::before{ top:-3px; }
  .marquee::after{ bottom:-3px; }
  .marquee h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(38px, 7vw, 62px);
    letter-spacing: 4px;
    margin: 0;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(212,169,75,.35);
  }
  .marquee p{
    margin: 6px 0 0;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: .5px;
    font-style: italic;
  }

  /* --- Settings panel --- */
  .panel{
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 26px;
  }
  .panel-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }
  .panel-toggle h2{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: 20px;
    margin:0;
    color: var(--gold);
  }
  .chev{ transition: transform .2s ease; color: var(--text-dim); }
  .panel.open .chev{ transform: rotate(180deg); }
  .panel-body{
    display:none;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .panel.open .panel-body{ display:block; }

  .field{ margin-bottom: 16px; }
  .field label{
    display:block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field small{ display:block; margin-top: 5px; color: var(--text-dim); font-size:12px; }
  .field small a{ color: var(--gold); text-decoration:none; border-bottom: 1px dotted var(--gold-dim); }
  input[type=text], select{
    width:100%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  input[type=text]:focus, select:focus{ outline: 1px solid var(--gold); border-color: var(--gold); }

  .row{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width:560px){ .row{ grid-template-columns: 1fr; } }

  .toggles{ display:flex; gap:10px; flex-wrap:wrap; }
  .toggle-chip{
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 20px;
    cursor:pointer;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--bg-card);
    transition: all .15s ease;
  }
  .toggle-chip.active{
    color: var(--bg);
    background: var(--gold);
    border-color: var(--gold);
    font-weight:600;
  }

  .score-row{ display:flex; align-items:center; gap:14px; }
  .score-row input[type=range]{ flex:1; accent-color: var(--gold); }
  .score-val{
    font-family:'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gold);
    min-width: 46px;
    text-align:center;
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    padding: 2px 0;
  }

  .btn{
    display:inline-block;
    background: var(--gold);
    color: var(--bg);
    border: none;
    padding: 13px 26px;
    border-radius: 6px;
    font-family:'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1.5px;
    cursor: pointer;
    width:100%;
  }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn:hover:not(:disabled){ background:#e5bb5f; }

  /* --- Status / progress --- */
  .status{
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    margin: 18px 0;
    min-height: 18px;
  }
  .status.error{ color: var(--velvet); }

  /* --- Results --- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
  }
  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display:flex;
    flex-direction: column;
  }
  .poster-wrap{ position:relative; aspect-ratio: 2/3; background:#0a0b0e; }
  .poster-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .rating-bulb{
    position:absolute; top:8px; right:8px;
    background: rgba(15,17,22,.85);
    border: 1.5px solid var(--gold);
    color: var(--gold);
    font-family:'Bebas Neue', sans-serif;
    font-size: 15px;
    width: 38px; height:38px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
  }
  .platform-tag{
    position:absolute; bottom:8px; left:8px;
    font-size: 10px;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    font-weight:600;
  }
  .platform-tag.netflix{ background:#E50914; color:#fff; }
  .platform-tag.prime{ background:#00A8E1; color:#0F1116; }

  .card-body{ padding: 10px 12px 14px; flex:1; display:flex; flex-direction:column; }
  .card-body h3{ font-size: 14px; margin: 0 0 4px; line-height:1.3; }
  .card-body .year{ font-size:12px; color:var(--text-dim); margin-bottom: 10px; }
  .card-links{ margin-top:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .card-links a{
    font-size: 11px;
    color: var(--text-dim);
    text-decoration:none;
    border: 1px solid var(--line);
    padding: 5px 8px;
    border-radius: 4px;
  }
  .card-links a:hover{ color: var(--gold); border-color: var(--gold-dim); }

  .empty{
    text-align:center;
    padding: 50px 20px;
    color: var(--text-dim);
  }
  .empty h3{ color: var(--text); font-family:'Bebas Neue',sans-serif; letter-spacing:1px; font-size:22px; }

  .filmstrip{
    display:flex; justify-content:center; gap:6px; margin: 10px 0 0;
  }
  .filmstrip span{
    width:8px; height:8px; border-radius:2px;
    background: var(--gold-dim);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .filmstrip span:nth-child(2){ animation-delay:.15s; }
  .filmstrip span:nth-child(3){ animation-delay:.3s; }
  .filmstrip span:nth-child(4){ animation-delay:.45s; }
  @keyframes pulse{ 0%,100%{ opacity:.3; } 50%{ opacity:1; background:var(--gold); } }
</style>
</head>
<body>
<div class="wrap">

  <div class="marquee">
    <h1>REEL SCORE</h1>
    <p>Movie night, minus the scrolling.</p>
  </div>

  <div class="panel open" id="panel">
    <div class="panel-toggle" id="panelToggle">
      <h2>Setup</h2>
      <span class="chev">▾</span>
    </div>
    <div class="panel-body">
      <div class="row">
        <div class="field">
          <label>TMDb API Key</label>
          <input type="text" id="tmdbKey" placeholder="paste key here" autocomplete="off">
          <small>Free — get one at <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a></small>
        </div>
        <div class="field">
          <label>OMDb API Key</label>
          <input type="text" id="omdbKey" placeholder="paste key here" autocomplete="off">
          <small>Free — get one at <a href="https://www.omdbapi.com/apikey.aspx" target="_blank" rel="noopener">omdbapi.com/apikey.aspx</a></small>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Region</label>
          <select id="region">
            <option value="US">United States</option>
            <option value="GB">United Kingdom</option>
            <option value="CA">Canada</option>
            <option value="AU">Australia</option>
            <option value="DE">Germany</option>
            <option value="FR">France</option>
            <option value="ES">Spain</option>
            <option value="IT">Italy</option>
            <option value="BR">Brazil</option>
            <option value="MX">Mexico</option>
            <option value="IN">India</option>
          </select>
        </div>
        <div class="field">
          <label>Minimum IMDb Score</label>
          <div class="score-row">
            <input type="range" id="minScore" min="5" max="9" step="0.1" value="7.0">
            <div class="score-val" id="minScoreVal">7.0</div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Where to look</label>
        <div class="toggles">
          <div class="toggle-chip active" data-service="netflix">Netflix</div>
          <div class="toggle-chip active" data-service="prime">Prime Video</div>
        </div>
      </div>

      <div class="field">
        <label>How many titles to scan per platform (more = slower, more thorough)</label>
        <select id="scanDepth">
          <option value="40">40 — quick</option>
          <option value="80" selected>80 — balanced</option>
          <option value="150">150 — thorough</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="searchBtn">Find Tonight's Movie</button>
  <div class="status" id="status"></div>

  <div id="results"></div>

</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const panel = $('panel');
  $('panelToggle').addEventListener('click', () => panel.classList.toggle('open'));

  const minScoreInput = $('minScore');
  const minScoreVal = $('minScoreVal');
  minScoreInput.addEventListener('input', () => minScoreVal.textContent = parseFloat(minScoreInput.value).toFixed(1));

  document.querySelectorAll('.toggle-chip').forEach(chip => {
    chip.addEventListener('click', () => chip.classList.toggle('active'));
  });

  const statusEl = $('status');
  const resultsEl = $('results');
  const searchBtn = $('searchBtn');

  function setStatus(msg, isError){
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }

  function selectedServices(){
    return Array.from(document.querySelectorAll('.toggle-chip.active')).map(c => c.dataset.service);
  }

  // --- persisted config via localStorage (works standalone, on-phone, offline) ---
  async function loadConfig(){
    try{
      const raw = localStorage.getItem('reel-score-config');
      if(raw){
        const cfg = JSON.parse(raw);
        if(cfg.tmdbKey) $('tmdbKey').value = cfg.tmdbKey;
        if(cfg.omdbKey) $('omdbKey').value = cfg.omdbKey;
        if(cfg.region) $('region').value = cfg.region;
        if(cfg.minScore){
          minScoreInput.value = cfg.minScore;
          minScoreVal.textContent = parseFloat(cfg.minScore).toFixed(1);
        }
        if(cfg.services){
          document.querySelectorAll('.toggle-chip').forEach(chip => {
            chip.classList.toggle('active', cfg.services.includes(chip.dataset.service));
          });
        }
        if(cfg.scanDepth) $('scanDepth').value = cfg.scanDepth;
        if(cfg.tmdbKey && cfg.omdbKey) panel.classList.remove('open');
      }
    }catch(e){ /* no saved config yet */ }
  }

  async function saveConfig(){
    const cfg = {
      tmdbKey: $('tmdbKey').value.trim(),
      omdbKey: $('omdbKey').value.trim(),
      region: $('region').value,
      minScore: minScoreInput.value,
      services: selectedServices(),
      scanDepth: $('scanDepth').value
    };
    try{ localStorage.setItem('reel-score-config', JSON.stringify(cfg)); }catch(e){}
  }

  // --- concurrency-limited fetch pool ---
  async function pool(items, worker, limit){
    const results = new Array(items.length);
    let i = 0;
    async function run(){
      while(i < items.length){
        const idx = i++;
        try{ results[idx] = await worker(items[idx], idx); }
        catch(e){ results[idx] = null; }
      }
    }
    await Promise.all(new Array(Math.min(limit, items.length)).fill(0).map(run));
    return results;
  }

  const PROVIDER_NAME_MATCH = {
    netflix: (name) => /netflix/i.test(name) && !/kids/i.test(name),
    prime: (name) => /amazon prime video|^prime video$/i.test(name)
  };

  async function getProviderIds(tmdbKey, region, services){
    const url = `https://api.themoviedb.org/3/watch/providers/movie?api_key=${tmdbKey}&watch_region=${region}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('tmdb-providers');
    const data = await res.json();
    const ids = {};
    for(const service of services){
      const match = data.results.find(p => PROVIDER_NAME_MATCH[service](p.provider_name));
      if(match) ids[service] = match.provider_id;
    }
    return ids;
  }

  async function discoverForProvider(tmdbKey, region, providerId, targetCount){
    let movies = [];
    let page = 1;
    const maxPages = Math.ceil(targetCount / 20);
    while(page <= maxPages){
      const url = `https://api.themoviedb.org/3/discover/movie?api_key=${tmdbKey}&watch_region=${region}&with_watch_providers=${providerId}&sort_by=popularity.desc&page=${page}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('tmdb-discover');
      const data = await res.json();
      movies = movies.concat(data.results || []);
      if(page >= (data.total_pages || 1)) break;
      page++;
    }
    return movies.slice(0, targetCount);
  }

  async function getImdbId(tmdbKey, movieId){
    const url = `https://api.themoviedb.org/3/movie/${movieId}/external_ids?api_key=${tmdbKey}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    return data.imdb_id || null;
  }

  async function getImdbRating(omdbKey, imdbId){
    const url = `https://www.omdbapi.com/?apikey=${omdbKey}&i=${imdbId}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(data.Response === 'False') return null;
    const rating = parseFloat(data.imdbRating);
    return isNaN(rating) ? null : rating;
  }

  function renderResults(movies){
    if(movies.length === 0){
      resultsEl.innerHTML = `
        <div class="empty">
          <h3>Nothing cleared the bar</h3>
          <p>No titles on the selected platform(s) hit your minimum score within the scan range.<br>Try lowering the score, scanning more titles, or checking a different region.</p>
        </div>`;
      return;
    }
    resultsEl.innerHTML = `<div class="grid">${movies.map(m => `
      <div class="card">
        <div class="poster-wrap">
          ${m.poster ? `<img src="${m.poster}" alt="${m.title} poster" loading="lazy">` : ''}
          <div class="rating-bulb">${m.rating.toFixed(1)}</div>
          <div class="platform-tag ${m.service}">${m.service === 'netflix' ? 'Netflix' : 'Prime'}</div>
        </div>
        <div class="card-body">
          <h3>${m.title}</h3>
          <div class="year">${m.year || ''}</div>
          <div class="card-links">
            <a href="https://www.imdb.com/title/${m.imdbId}/" target="_blank" rel="noopener">IMDb</a>
            <a href="${m.service === 'netflix' ? 'https://www.netflix.com/search?q=' + encodeURIComponent(m.title) : 'https://www.amazon.com/s?k=' + encodeURIComponent(m.title) + '&i=instant-video'}" target="_blank" rel="noopener">Open in app</a>
          </div>
        </div>
      </div>`).join('')}</div>`;
  }

  async function runSearch(){
    const tmdbKey = $('tmdbKey').value.trim();
    const omdbKey = $('omdbKey').value.trim();
    const region = $('region').value;
    const minScore = parseFloat(minScoreInput.value);
    const services = selectedServices();
    const scanDepth = parseInt($('scanDepth').value, 10);

    if(!tmdbKey || !omdbKey){
      setStatus('Add both a TMDb key and an OMDb key above to search.', true);
      panel.classList.add('open');
      return;
    }
    if(services.length === 0){
      setStatus('Pick at least one platform.', true);
      return;
    }

    await saveConfig();
    searchBtn.disabled = true;
    resultsEl.innerHTML = '';
    setStatus('Looking up what\'s streaming…');

    try{
      const providerIds = await getProviderIds(tmdbKey, region, services);
      const missing = services.filter(s => !providerIds[s]);
      if(missing.length){
        setStatus(`Could not find "${missing.join('", "')}" as a provider in this region — it may not be available there.`, true);
      }

      let candidates = [];
      for(const service of services){
        if(!providerIds[service]) continue;
        setStatus(`Pulling ${service === 'netflix' ? 'Netflix' : 'Prime Video'} catalog…`);
        const movies = await discoverForProvider(tmdbKey, region, providerIds[service], scanDepth);
        movies.forEach(m => candidates.push({ ...m, service }));
      }

      if(candidates.length === 0){
        setStatus('No titles found for that platform/region combination.', true);
        renderResults([]);
        searchBtn.disabled = false;
        return;
      }

      setStatus(`Checking IMDb scores for ${candidates.length} titles… this takes a moment`);

      let checked = 0;
      const enriched = await pool(candidates, async (m) => {
        const imdbId = await getImdbId(tmdbKey, m.id);
        checked++;
        if(checked % 8 === 0) setStatus(`Checking IMDb scores… ${checked}/${candidates.length}`);
        if(!imdbId) return null;
        const rating = await getImdbRating(omdbKey, imdbId);
        if(rating === null) return null;
        return {
          title: m.title,
          year: m.release_date ? m.release_date.slice(0,4) : '',
          poster: m.poster_path ? `https://image.tmdb.org/t/p/w342${m.poster_path}` : null,
          imdbId,
          rating,
          service: m.service
        };
      }, 6);

      const filtered = enriched
        .filter(m => m && m.rating >= minScore)
        .sort((a,b) => b.rating - a.rating);

      // de-dupe titles that show up on both platforms, keep first
      const seen = new Set();
      const deduped = filtered.filter(m => {
        if(seen.has(m.imdbId)) return false;
        seen.add(m.imdbId);
        return true;
      });

      setStatus(`${deduped.length} movie${deduped.length === 1 ? '' : 's'} at ${minScore.toFixed(1)}+ out of ${candidates.length} scanned.`);
      renderResults(deduped);
    }catch(e){
      console.error(e);
      setStatus('Something went wrong talking to TMDb or OMDb. Double-check your API keys and try again.', true);
    }finally{
      searchBtn.disabled = false;
    }
  }

  searchBtn.addEventListener('click', runSearch);
  loadConfig();
})();
</script>
</body>
</html>
